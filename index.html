<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Cronômetro</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #000;
    touch-action: manipulation;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    -webkit-user-select: none;
    font-family: Arial, sans-serif;
  }

  #timer {
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  /* Cada número é desenhado com segmentos fixos.
     Isso mantém a largura dos dígitos idêntica e evita "pulos". */
  #display {
    display: flex;
    align-items: center;
    justify-content: center;
    width: min(98vw, 98vh * 4.2);
    height: min(72vh, 72vw / 4.2);
    gap: clamp(4px, 0.8vw, 18px);
  }

  .digit {
    position: relative;
    width: calc(100% / 8.5);
    height: 100%;
    flex: 0 0 calc(100% / 8.5);
  }

  .seg {
    position: absolute;
    background: #20ff68;
    border-radius: 999px;
    filter: none;
    opacity: 1;
  }

  .a, .g, .d {
    left: 12%;
    width: 76%;
    height: 7%;
  }
  .a { top: 1%; }
  .g { top: 46.5%; transform: translateY(-50%); }
  .d { bottom: 1%; }

  .f, .b, .e, .c {
    width: 7%;
    height: 42%;
  }
  .f { left: 2%; top: 5%; }
  .b { right: 2%; top: 5%; }
  .e { left: 2%; bottom: 5%; }
  .c { right: 2%; bottom: 5%; }

  .off {
    opacity: 0;
  }

  .colon {
    width: calc(100% / 20);
    height: 100%;
    flex: 0 0 calc(100% / 20);
    position: relative;
  }

  .dot {
    position: absolute;
    width: 28%;
    aspect-ratio: 1;
    background: #20ff68;
    border-radius: 50%;
    left: 50%;
    transform: translateX(-50%);
  }
  .dot.top { top: 32%; }
  .dot.bottom { bottom: 32%; }

  #reset {
    display: none;
    position: fixed;
    right: max(14px, env(safe-area-inset-right));
    bottom: max(14px, env(safe-area-inset-bottom));
    border: 0;
    background: rgba(255,255,255,.13);
    color: white;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    font-size: 22px;
    line-height: 1;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  @media (max-width: 700px) {
    #reset { display: block; }
  }
</style>
</head>
<body>

<div id="timer" aria-label="Cronômetro">
  <div id="display"></div>
</div>

<button id="reset" aria-label="Resetar">↻</button>

<script>
(() => {
  const display = document.getElementById('display');
  const timer = document.getElementById('timer');
  const resetBtn = document.getElementById('reset');

  // 7 segmentos: a b c d e f g
  const map = {
    '0': 'abcdef',
    '1': 'bc',
    '2': 'abdeg',
    '3': 'abcdg',
    '4': 'bcfg',
    '5': 'acdfg',
    '6': 'acdefg',
    '7': 'abc',
    '8': 'abcdefg',
    '9': 'abcdfg'
  };

  const chars = [];

  function makeDigit() {
    const el = document.createElement('div');
    el.className = 'digit';
    for (const s of ['a','b','c','d','e','f','g']) {
      const seg = document.createElement('span');
      seg.className = `seg ${s}`;
      el.appendChild(seg);
    }
    chars.push(el);
    display.appendChild(el);
  }

  function makeColon() {
    const el = document.createElement('div');
    el.className = 'colon';
    const top = document.createElement('span');
    const bottom = document.createElement('span');
    top.className = 'dot top';
    bottom.className = 'dot bottom';
    el.append(top, bottom);
    display.appendChild(el);
  }

  // 00:00:00
  for (let i = 0; i < 2; i++) makeDigit();
  makeColon();
  for (let i = 0; i < 2; i++) makeDigit();
  makeColon();
  for (let i = 0; i < 2; i++) makeDigit();

  function setDigit(el, n) {
    const active = map[n];
    for (const seg of el.children) {
      seg.classList.toggle('off', !active.includes(seg.classList[1]));
    }
  }

  function show(ms) {
    const total = Math.floor(ms / 10); // centésimos
    const minutes = Math.floor(total / 6000) % 100;
    const seconds = Math.floor(total / 100) % 60;
    const hundredths = total % 100;

    const value =
      String(minutes).padStart(2, '0') +
      String(seconds).padStart(2, '0') +
      String(hundredths).padStart(2, '0');

    for (let i = 0; i < 6; i++) setDigit(chars[i], value[i]);
  }

  let running = false;
  let elapsed = 0;
  let startedAt = 0;
  let raf = 0;

  function frame(now) {
    if (!running) return;
    elapsed = now - startedAt;
    show(elapsed);
    raf = requestAnimationFrame(frame);
  }

  function toggle() {
    if (running) {
      running = false;
      elapsed = performance.now() - startedAt;
      cancelAnimationFrame(raf);
    } else {
      running = true;
      startedAt = performance.now() - elapsed;
      raf = requestAnimationFrame(frame);
    }
  }

  function reset() {
    running = false;
    cancelAnimationFrame(raf);
    elapsed = 0;
    show(0);
  }

  // Computador: espaço = iniciar/pausar/despausar, Enter = resetar
  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
      e.preventDefault();
      toggle();
    } else if (e.code === 'Enter') {
      e.preventDefault();
      reset();
    }
  });

  // Celular: toque em qualquer lugar inicia/pausa/despausa.
  // O botão de reset fica separado no canto.
  timer.addEventListener('pointerup', (e) => {
    if (e.pointerType === 'mouse' && window.innerWidth > 700) return;
    toggle();
  });

  resetBtn.addEventListener('pointerup', (e) => {
    e.stopPropagation();
    reset();
  });

  show(0);
})();
</script>
</body>
</html>
